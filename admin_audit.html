    <h1>System Audit Log</h1>


<table border="1">

    <tr>
    <th>Bill</th>
    <th>Action</th>
    <th>User</th>
    <th>Time</th>
    </tr>

    {% for a in audits %}

    <tr>
    <th>{{a.bill_id}}</th>
    <th>{{a.action}}</th>
    <th>{{a.user_email}}</th>
    <th>{{a.timestamp}}</th>
    </tr>

 {% endfor %}

</table>
